name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elektro-mobile-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, elektro-mobile]
    timeout-minutes: 20
    steps:
      - name: Pull va deploy
        env:
          DEPLOY_PATH: /home/sroot/FRONTEND_PROJECTS/mobile-energolearning
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
          bash scripts/deploy-server.sh
